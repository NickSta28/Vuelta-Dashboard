<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vuelta 2026 – Top-20 Dashboard</title>
<style>
  :root {
    --red: #C8102E;
    --red-dark: #8C0B20;
    --red-tint: #FBE9EC;
    --ink: #1C1C1E;
    --ink-soft: #55555A;
    --ink-faint: #8A8A8E;
    --paper: #FAF9F7;
    --card: #FFFFFF;
    --line: #E7E4DF;
    --gold: #B8860B;
    --amber: #C77800;
    --orange: #C1521C;
    --danger: #A32D2D;
    --green: #3B6D11;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 0 40px; }

  header {
    background: var(--red);
    color: #fff;
    padding: 22px 18px 18px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.85;
    font-weight: 600;
  }
  header h1 {
    margin: 4px 0 2px;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header .meta {
    font-size: 12.5px;
    opacity: 0.9;
  }

  .legend {
    display: flex;
    gap: 6px;
    padding: 12px 16px;
    overflow-x: auto;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .legend-chip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }

  .list { padding: 10px 12px 0; }

  .rider {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .rider summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: center;
    gap: 10px;
  }
  .rider summary::-webkit-details-marker { display: none; }

  .rank {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-faint);
  }

  .who .name {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.25;
  }
  .who .team {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 1px;
  }

  .stats {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pcs {
    text-align: right;
    line-height: 1.1;
  }
  .pcs .num {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
  }
  .pcs .lbl {
    font-size: 9px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .rating {
    min-width: 26px;
    height: 26px;
    padding: 0 7px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
  }
  .r5 { background: var(--green); }
  .r4 { background: #5C8A1E; }
  .r3 { background: var(--amber); }
  .r2 { background: var(--orange); }
  .r1 { background: var(--danger); }

  .chevron {
    font-size: 11px;
    color: var(--ink-faint);
    transition: transform 0.15s ease;
    margin-left: 2px;
  }
  .rider[open] .chevron { transform: rotate(90deg); }

  .detail {
    padding: 2px 14px 14px;
    border-top: 1px solid var(--line);
    margin-top: 2px;
  }
  .row {
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row .k {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--red-dark);
    margin-bottom: 2px;
  }
  .row .v {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.45;
  }
  .row.warn .k { color: var(--danger); }
